@if (openStep(); as step) {
  <app-riddle-panel [title]="stepLabel(step)" (closed)="backToMap()">
    <!-- Chaque tâche 9 à 12 ajoute ici un @case avec son composant, branché sur (solved)="backToMap()". -->
    @switch (step) {
      @case ('padlock') {
        <app-padlock-riddle (solved)="backToMap()" />
      }
      @case ('password') {
        <app-password-riddle (solved)="backToMap()" />
      }
      @default {
        <p class="coming-soon">Cette étape se prépare encore. Revenez bientôt, moussaillon !</p>
      }
    }
  </app-riddle-panel>
} @else {
  <main class="map-screen">
    <header class="intro">
      <h1 class="title">La chasse au trésor</h1>
      <p class="lead">Suivez le chemin et résolvez chaque énigme pour trouver le trésor.</p>
    </header>
    <app-treasure-map class="map" (stepSelected)="openMapStep($event)" />
  </main>
}
