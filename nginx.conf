# Configuration nginx du site statique Potixx (chasse au trésor).
# Remplace /etc/nginx/conf.d/default.conf de l'image nginxinc/nginx-unprivileged:alpine,
# qui écoute déjà sur le port 8080 par défaut (utilisateur non root).

server {
    listen 8080;
    listen [::]:8080;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Site privé (chasse au trésor familiale) : jamais indexé, quelle que soit la
    # réponse. nginx n'hérite pas des `add_header` d'un niveau parent dans une
    # location qui définit les siens : cette ligne est donc répétée dans chaque
    # location ci-dessous qui ajoute ses propres en-têtes.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Application « single page » : toute route inconnue de l'historique Angular
    # retombe sur index.html (pas de 404 côté nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html référence les fichiers hashés ci-dessous : il ne doit jamais
    # être mis en cache, sinon un visiteur déjà venu ne verrait pas un déploiement.
    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # Fichiers JS/CSS générés avec un hash dans leur nom (outputHashing: all) :
    # le contenu d'une URL donnée ne change jamais, cache long et immuable.
    location ~* \.(?:js|css)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, vidéo, carte : servis sous /assets sans hash dans leur nom,
    # cache modéré (une heure) pour permettre une mise à jour du contenu.
    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600";
    }
}
