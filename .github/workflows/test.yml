name: Tests

# Lancé sur chaque pull request vers master et sur chaque push sur master (ce qui détecte une
# fusion cassée). La publication de l'image Docker est un workflow séparé, déclenché par un tag
# (publish.yml).
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Annule une exécution en cours du workflow sur la même branche dès qu'un nouveau push arrive,
# pour ne pas gaspiller de minutes CI sur du code déjà obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back:
    name: Back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

      # Même version que .tool-versions, avec la configuration backend/.golangci.yml.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

  front:
    name: Front
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification du formatage
        run: npm run format:check

      - name: Tests unitaires
        run: npm test

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run e2e

      - name: Archivage du rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Le rapport HTML (activé en CI dans playwright.config.ts) explique les échecs, et
          # test-results/ contient les traces ('trace: on-first-retry') et captures des essais
          # ayant échoué : les deux sont nécessaires pour déboguer un échec E2E depuis la CI.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
