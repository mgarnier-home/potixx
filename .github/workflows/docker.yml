name: CI/CD

on:
  pull_request:
  push:
    # Le dépôt local du propriétaire a encore `master` comme branche par défaut alors que la
    # spec vise `main` : on déclenche sur les deux, et `{{is_default_branch}}` (résolu par
    # docker/metadata-action via l'API GitHub) réserve le tag `latest` à la vraie branche par
    # défaut du dépôt, quelle qu'elle soit.
    branches:
      - main
      - master
    tags:
      - 'v*'

# Annule une exécution en cours du workflow sur la même réf (branche ou PR) dès qu'un nouveau
# push arrive, pour ne pas gaspiller de minutes CI sur du code déjà obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification du formatage
        run: npm run format:check

      - name: Tests unitaires
        run: npm test

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run e2e

      - name: Archivage du rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Image Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Préparation de Buildx
        uses: docker/setup-buildx-action@v4

      - name: Calcul des tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/mgarnier11/potixx
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Une pull request n'a pas accès aux secrets et ne doit jamais publier d'image : on ne se
      # connecte à Docker Hub que pour les autres déclencheurs (push sur main/master ou tag v*).
      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et publication de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
