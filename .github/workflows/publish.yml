name: Publication

run-name: Publication de la version ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. 1.2.0)"
        required: true
        type: string

# Deux publications simultanées de la même version se marcheraient dessus : la seconde attend
# la fin de la première au lieu de l'annuler (une publication interrompue laisserait des tags
# à moitié poussés).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      # La version saisie passe par une variable d'environnement, jamais par interpolation
      # directe dans le script : une saisie malveillante ne peut ainsi pas injecter de commande.
      - name: Vérification du numéro de version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version invalide « $VERSION » : format attendu X.Y.Z (ex. 1.2.0 ou 1.2.0-rc.1), sans préfixe « v »."
            exit 1
          fi

      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Préparation de Buildx
        uses: docker/setup-buildx-action@v4

      # `latest` n'accompagne la version que si le workflow est lancé depuis la branche par
      # défaut du dépôt : publier depuis une autre branche ne doit pas déplacer `latest`.
      - name: Calcul des tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/mgarnier11/potixx
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et publication de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
